[package]
name = "memex"
version = "0.8.0"
edition = "2024"
authors = ["garnizeh"]
description = "Local, Offline Documentation Context Server (MCP) for LLMs & AI Coding Agents"
license = "MIT"
readme = "README.md"
repository = "https://github.com/garnizeh/memex"

[dependencies]
# CLI
clap = { version = "4.6.6", features = ["derive"] }

# Async runtime
tokio = { version = "1.53.1", features = ["full"] }

# Serialization & Protocols
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

# Markdown Parsing
pulldown-cmark = { version = "0.13.4", default-features = false }

# Database & Vectors
rusqlite = { version = "0.40.2", features = ["bundled", "modern_sqlite"] }
sqlite-vec = "0.1.9"

# ONNX Runtime & Embeddings
ort = { version = "2.0.0-rc.13", default-features = false, features = ["download-binaries", "tls-rustls"] }
tokenizers = { version = "0.23.1", default-features = false, features = ["onig"] }

# File system & Ignores
ignore = "0.4.33"
directories = "6.0.0"
walkdir = "2.5.0"

# Utilities & Error Handling
indicatif = "0.18.6"
thiserror = "2.0.20"
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
sha2 = "0.11.0"
hex = "0.4.3"
ureq = "3.4.0"

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
tempfile = "3.27.0"
tiktoken-rs = "0.12.0"

[[bench]]
name = "bench_token_efficiency"
harness = false
required-features = []

[[bench]]
name = "bench_ingestion"
harness = false
required-features = []

[[bench]]
name = "bench_query"
harness = false
required-features = []

[[bench]]
name = "run_empirical_benchmark"
harness = false
required-features = []

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = true
